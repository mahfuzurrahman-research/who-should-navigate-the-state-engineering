name: public-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core
      - name: Run both synthetic demos and their tests
        run: ./run_all_demos.sh
      - name: Verify public boundary
        run: |
          test ! -e manuscript
          test ! -e supplement
          test ! -e reference
          test ! -e validation
          test ! -e provenance
      - name: Docker build and run
        run: |
          docker build -t state-navigation-engineering .
          docker run --rm state-navigation-engineering
      - name: Upload public validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-statistical-validation
          path: outputs/
